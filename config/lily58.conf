# Enable the OLED display feature in ZMK
CONFIG_ZMK_DISPLAY=y

# individual widgets:
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# Show battery percentage instead of just an icon
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Enable peripheral battery monitoring
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Encoder Kconfig lines
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable Words Per Minute (WPM) calculation
CONFIG_ZMK_WPM=y

# Enable the WPM status widget
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Enable the HID indicators widget (which includes Caps Lock status)
CONFIG_ZMK_WIDGET_HID_INDICATORS_STATUS=y

